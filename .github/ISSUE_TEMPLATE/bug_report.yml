name: Сообщить об ошибке
description: Создать отчёт о воспроизводимой проблеме WeekTracker
title: "[Ошибка]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Перед отправкой удалите приватные ID, токены, credentials и персональные данные.
  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Что работает неправильно?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Увидеть ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер и устройство
      placeholder: Версия браузера, операционная система, тип устройства
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs или screenshots
      description: Приложите только очищенные материалы. Оставьте поле пустым, если их нет.
  - type: checkboxes
    id: privacy
    attributes:
      label: Подтверждение безопасности данных
      options:
        - label: Я удалил(а) sensitive IDs, tokens, credentials, deployment URLs и персональные данные.
          required: true
